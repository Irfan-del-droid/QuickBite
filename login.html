<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | QuickBite</title>
  <!-- Shared Golden Feast Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <!-- Top Navigation Header -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" aria-label="QuickBite Home">
        <span class="brand-icon">🍛</span>
        <span class="brand-text">Quick<span class="brand-highlight">Bite</span></span>
      </a>

      <nav class="nav-links" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="#" class="nav-link" onclick="alert('Order history is not available yet.'); return false;">My Orders</a>
        <a href="login.html" id="nav-login-link" class="nav-link active" aria-current="page">Login</a>
        <a href="register.html" class="nav-link">Register</a>
        <a href="cart.html" class="cart-link-btn" aria-label="View Shopping Cart">
          <span>🛒 Cart</span>
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Login Container -->
  <main class="auth-main">
    <div class="auth-card-wrapper">
      <div class="auth-card">

        <!-- Header / Greeting -->
        <div class="auth-header">
          <div class="badge-tag">Golden Feast Experience</div>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to relish hot and savory dishes delivered straight to your doorstep.</p>
        </div>

        <!-- Feedback Alert Container -->
        <div id="auth-alert" class="auth-alert" role="alert" aria-live="polite" style="display: none;"></div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" novalidate>
          
          <!-- Email Address -->
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address <span class="required-star">*</span></label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">✉️</span>
              <input 
                type="email" 
                id="login-email" 
                name="email" 
                class="form-input" 
                placeholder="name@example.com" 
                autocomplete="email" 
                required
              >
            </div>
            <p id="email-error" class="field-error" aria-live="polite"></p>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="label-row">
              <label for="login-password" class="form-label">Password <span class="required-star">*</span></label>
            </div>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                class="form-input" 
                placeholder="Enter your password" 
                autocomplete="current-password" 
                required
              >
              <button 
                type="button" 
                id="toggle-login-password" 
                class="btn-toggle-password" 
                aria-label="Toggle password visibility" 
                aria-pressed="false"
              >
                👁️
              </button>
            </div>
            <p id="password-error" class="field-error" aria-live="polite"></p>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner" aria-hidden="true" style="display: none;">⏳</span>
          </button>
        </form>

        <!-- Form Footer -->
        <div class="auth-footer">
          <p>Don't have an account yet? <a href="register.html" class="auth-link">Create an Account</a></p>
        </div>

      </div>
    </div>
  </main>

  <!-- Shared Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
